name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  guard:
    name: Manifest guard
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.exists }}
      typescript: ${{ steps.typescript.outputs.exists }}
      python: ${{ steps.python.outputs.exists }}
      go: ${{ steps.go.outputs.exists }}
      php: ${{ steps.php.outputs.exists }}
      vectors: ${{ steps.vectors.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: typescript
        if: ${{ hashFiles('ports/typescript/package.json') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: python
        if: ${{ hashFiles('ports/python/pyproject.toml') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: go
        if: ${{ hashFiles('ports/go/go.mod') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: php
        if: ${{ hashFiles('ports/php/composer.json') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: vectors
        if: ${{ hashFiles('vectors/generate_vectors.py') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (core)
    needs: guard
    if: needs.guard.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-llvm-cov (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build (std)
        run: cargo build --verbose
      - name: Build (no_std)
        run: cargo build --no-default-features --verbose
      - name: Test (unit + integration + shared vectors)
        run: cargo test --verbose
      - name: Coverage (>=95% lines; CLI entry excluded)
        run: cargo llvm-cov --fail-under-lines 95 --summary-only --ignore-filename-regex 'src/main\.rs$'

  typescript:
    name: TypeScript
    needs: guard
    if: needs.guard.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (dual ESM + CJS)
        run: npm run build
      - name: Test + coverage thresholds (>=95% stmt, >=90% branch)
        run: npm test

  python:
    name: Python
    needs: guard
    if: needs.guard.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/python
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (library + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy src
      - name: Test + coverage thresholds (>=95% combined w/ branch)
        run: pytest tests/ --cov=lomboksimhash --cov-branch --cov-report=term --cov-fail-under=95

  go:
    name: Go
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/go
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet
        run: go vet ./...
      - name: Gofmt check
        run: test -z "$(gofmt -l .)"
      - name: Test (unit + shared vectors) with statement coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | awk '/^total:/ { gsub("%","",$3); if ($3+0 < 95.0) { print "coverage", $3"%", "< 95%"; exit 1 } }'

  php:
    name: PHP
    needs: guard
    if: needs.guard.outputs.php == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/php
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gmp, mbstring
          coverage: none
      - name: Validate composer.json (strict)
        run: composer validate --strict
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress
      - name: Test (PHPUnit + shared vectors)
        run: vendor/bin/phpunit

  vectors-determinism:
    name: Vectors determinism
    needs: guard
    if: needs.guard.outputs.vectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and verify byte-identical
        run: python3 vectors/generate_vectors.py --check
