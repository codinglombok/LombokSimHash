name: Release to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    if: ${{ hashFiles('ports/typescript/package.json') != '' }}
    defaults:
      run:
        working-directory: ports/typescript
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Typecheck + Build (dual ESM/CJS)
        run: |
          npm run typecheck
          npm run build
      - name: Test + coverage thresholds
        run: npm test
      - name: Verify package contents (pack dry-run)
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
