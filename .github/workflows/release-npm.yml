name: Release to npm

on:
  push:
    tags:
      - "v*"

jobs:
  guard:
    name: Manifest guard
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        if: ${{ hashFiles('ports/typescript/package.json') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish npm package
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/typescript
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Typecheck + Build (dual ESM/CJS)
        run: |
          npm run typecheck
          npm run build
      - name: Test + coverage thresholds
        run: npm test
      - name: Verify package contents (pack dry-run)
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
