name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allows targeted re-release of PyPI without re-pushing the tag

jobs:
  guard:
    name: Manifest guard
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        if: ${{ hashFiles('ports/python/pyproject.toml') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Python package
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: ports/python
    permissions:
      id-token: write   # for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (library + dev tools)
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[dev]"
      - name: Gates (ruff + mypy + tests incl. shared vectors)
        run: |
          ruff check src tests
          mypy src
          pytest tests/
      - name: Build distribution (sdist + wheel)
        run: python -m build
      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/lsh-smoke
          /tmp/lsh-smoke/bin/pip install --quiet dist/*.whl
          /tmp/lsh-smoke/bin/python -c "from lomboksimhash import simhash64_text; v = f'{simhash64_text(chr(116)+chr(104)+chr(101)+chr(32)+chr(102)+chr(111)+chr(120)):016x}'; expected = '54b080184441c10c'; assert v == expected, 'smoke mismatch: got ' + v + ', expected ' + expected; print('smoke OK: simhash64_text(the fox) =', v)"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ports/python/dist/
