name: Release to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Manifest guard
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.rust.outputs.exists }}
      typescript: ${{ steps.typescript.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: rust
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - id: typescript
        if: ${{ hashFiles('ports/typescript/package.json') != '' }}
        run: echo "exists=true" >> "$GITHUB_OUTPUT"

  npm-gpr:
    name: npm mirror (@codinglombok scope)
    needs: guard
    if: needs.guard.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: ports/typescript
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ports/typescript/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: '@codinglombok'
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Typecheck + Build (dual ESM/CJS)
        run: |
          npm run typecheck
          npm run build
      - name: Test + coverage thresholds
        run: npm test
      - name: Guard — release tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "release tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - name: Scope package name for GitHub Packages
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.name='@codinglombok/lomboksimhash';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - name: Publish to GitHub Packages (skip if version already exists)
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          if npm view "@codinglombok/lomboksimhash@$PKG_VER" version >/dev/null 2>&1; then
            echo "@codinglombok/lomboksimhash@$PKG_VER already exists on GitHub Packages - skipping publish (idempotent)"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container image (ghcr.io)
    needs: guard
    if: needs.guard.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment: docker
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx (docker-container driver — required for type=gha cache export)
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/codinglombok/lomboksimhash
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
