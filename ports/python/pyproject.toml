[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lomboksimhash"
version = "0.1.0"
description = "Locality-sensitive hashing for near-duplicate document detection. SimHash, MinHash, LSH, SHA-256, and shingling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "CodingLombok", email = "codinglombok@gmail.com" }
]
keywords = [
    "simhash",
    "minhash",
    "lsh",
    "deduplication",
    "hashing",
    "locality-sensitive-hashing",
    "near-duplicate",
    "lombok",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codinglombok/LombokSimHash"
Repository = "https://github.com/codinglombok/LombokSimHash.git"
Changelog = "https://github.com/codinglombok/LombokSimHash/blob/main/changelog.md"

[tool.setuptools]
packages = ["lomboksimhash"]
